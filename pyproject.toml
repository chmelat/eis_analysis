[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eis-analysis"
dynamic = ["version"]
description = "Modular toolkit for electrochemical impedance spectroscopy analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "ruff",
    # mypy 2.x refuses python_version = "3.9" ("must be 3.10 or higher") and
    # exits with a fatal config error instead of type-checking. The project
    # still supports 3.9 (see requires-python), so the checker is held back
    # rather than the floor raised. Lift this pin when the 3.9 floor is
    # dropped, not before.
    "mypy<2",
    "pytest",
]

[project.scripts]
eis = "eis:main"

[tool.setuptools.dynamic]
version = {attr = "eis_analysis.version.__version__"}

[tool.setuptools]
py-modules = ["eis"]

[tool.setuptools.packages.find]
include = ["eis_analysis*"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults. CI installs ruff
# unpinned, so a release that widens the default rule set turns the lint job red
# without a single line of code changing - which is exactly what happened with
# ruff 0.16.0 (2026-07-23): 578 new findings, all style/modernization, none
# affecting correctness. This set is what the project has actually been linted
# against since the beginning (ruff's historical default: pycodestyle errors +
# pyflakes). Widening it is a deliberate decision, not a side effect of an
# upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
