[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eis-analysis"
dynamic = ["version"]
description = "Modular toolkit for electrochemical impedance spectroscopy analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
    "coverage",
    "vulture",
]

[project.scripts]
eis = "eis:main"

[tool.setuptools.dynamic]
version = {attr = "eis_analysis.version.__version__"}

[tool.setuptools]
py-modules = ["eis"]

[tool.setuptools.packages.find]
include = ["eis_analysis*"]

[tool.pytest.ini_options]
# The ZScope regression benchmark fits four reference circuits at three noise
# levels with DE - roughly 14 s, a sixth of the suite - to catch degradations
# in the optimizer, the analytic Jacobian or an element's impedance. That is
# worth running before a release, not on every edit, so it is marked `slow`
# and excluded by default. Run it with `pytest -m ""` (everything) or
# `pytest -m slow` (only the benchmarks; the DE fits of the driftlet reference
# spectra, tests/test_driftlet_randles.py, ~20 s, are marked the same way).
# The stress test's smoke run (tests/test_stress_smoke.py, ~1.5 min) is
# excluded the same way: `pytest -m stress`.
addopts = '-m "not slow and not stress"'
markers = ["slow: long-running regression benchmarks, excluded by default",
           "stress: smoke run of the stress test against its baseline, excluded by default"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults. CI installs ruff
# unpinned, so a release that widens the default rule set turns the lint job red
# without a single line of code changing - which is exactly what happened with
# ruff 0.16.0 (2026-07-23): 578 new findings, all style/modernization, none
# affecting correctness. This set is what the project has actually been linted
# against since the beginning (ruff's historical default: pycodestyle errors +
# pyflakes). Widening it is a deliberate decision, not a side effect of an
# upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

# Layering rules of CLAUDE.md ("Code Organization"), checked by `lint-imports`
# (CI job typecheck). All held when added (2026-10-31); io.export may import
# the oxide result type it writes.
[tool.importlinter]
root_package = "eis_analysis"

[[tool.importlinter.contracts]]
name = "Only the CLI imports the CLI (CLI separated from core logic)"
type = "forbidden"
source_modules = [
    "eis_analysis.analysis", "eis_analysis.drt", "eis_analysis.fitting", "eis_analysis.io",
    "eis_analysis.rinf_estimation", "eis_analysis.utils", "eis_analysis.validation",
    "eis_analysis.visualization",
]
forbidden_modules = ["eis_analysis.cli"]

[[tool.importlinter.contracts]]
name = "Algorithms and I/O do not import visualization (headless use)"
type = "forbidden"
source_modules = [
    "eis_analysis.analysis", "eis_analysis.drt", "eis_analysis.fitting", "eis_analysis.io",
    "eis_analysis.rinf_estimation", "eis_analysis.utils", "eis_analysis.validation",
]
forbidden_modules = ["eis_analysis.visualization"]

[[tool.importlinter.contracts]]
name = "Computations do not import I/O (testing without files)"
type = "forbidden"
source_modules = [
    "eis_analysis.analysis", "eis_analysis.drt", "eis_analysis.fitting",
    "eis_analysis.rinf_estimation", "eis_analysis.utils", "eis_analysis.validation",
    "eis_analysis.visualization",
]
forbidden_modules = ["eis_analysis.io"]

[[tool.importlinter.contracts]]
name = "Core methods do not import the domain analysis (domain logic isolated)"
type = "forbidden"
source_modules = [
    "eis_analysis.drt", "eis_analysis.fitting", "eis_analysis.rinf_estimation",
    "eis_analysis.utils", "eis_analysis.validation", "eis_analysis.visualization",
]
forbidden_modules = ["eis_analysis.analysis"]

[[tool.importlinter.contracts]]
name = "utils imports no other subpackage (base layer)"
type = "forbidden"
source_modules = ["eis_analysis.utils"]
forbidden_modules = [
    "eis_analysis.analysis", "eis_analysis.cli", "eis_analysis.drt", "eis_analysis.fitting",
    "eis_analysis.io", "eis_analysis.rinf_estimation", "eis_analysis.validation",
    "eis_analysis.visualization",
]
